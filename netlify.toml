[build]
  command = "bun run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true
  # Per IP across all API methods, before the function runs. Generous on purpose:
  # a whole class behind one school NAT shares an IP, and reads must not starve.
  # Writes have tighter per-IP limits inside the function.
  [redirects.rate_limit]
    window_limit = 1000
    window_size = 60
    aggregate_by = ["ip", "domain"]

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
